[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "eventregistry-llm"
version = "0.1.0"
description = "Event-level political outlet sentiment analysis using EventRegistry and LLMs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.52.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
]

[project.scripts]
eventregistry-llm = "eventregistry_llm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
